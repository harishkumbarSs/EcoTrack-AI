<mat-sidenav-container class="app-container" [class.dark-theme]="isDark" [class.light-theme]="!isDark">

  <!-- ─── Sidebar ─────────────────────────────────────────────────── -->
  <mat-sidenav #sidenav mode="side" opened class="sidebar" role="navigation" aria-label="Main navigation">
    <!-- Logo -->
    <div class="sidebar-logo" routerLink="/dashboard" role="banner">
      <div class="logo-icon" aria-hidden="true">🌿</div>
      <div class="logo-text">
        <span class="logo-name">EcoTrack</span>
        <span class="logo-badge">AI</span>
      </div>
    </div>

    <!-- Nav Items -->
    <nav class="sidebar-nav" aria-label="Primary navigation">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        class="nav-item"
        [class.active]="isActive(item.path)"
        [attr.aria-label]="item.ariaLabel"
        [attr.aria-current]="isActive(item.path) ? 'page' : null"
        tabindex="0"
      >
        <mat-icon class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
        <div class="nav-indicator" *ngIf="isActive(item.path)" aria-hidden="true"></div>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <div class="theme-toggle" role="group" aria-label="Theme settings">
        <mat-icon aria-hidden="true">{{ isDark ? 'dark_mode' : 'light_mode' }}</mat-icon>
        <mat-slide-toggle
          [checked]="isDark"
          (change)="toggleTheme()"
          color="accent"
          aria-label="Toggle dark mode"
        ></mat-slide-toggle>
      </div>
      <p class="sidebar-version">v1.0.0</p>
    </div>
  </mat-sidenav>

  <!-- ─── Main Content ─────────────────────────────────────────────── -->
  <mat-sidenav-content class="main-content">
    <!-- Header -->
    <header class="app-header" role="banner">
      <div class="header-left">
        <h1 class="page-title" id="main-content">
          {{ navItems | activeLabel : currentRoute }}
        </h1>
      </div>
      <div class="header-right">
        <div class="eco-status" aria-label="EcoTrack AI Status: Active">
          <div class="status-dot" aria-hidden="true"></div>
          <span>Tracking Active</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main id="main-content" class="page-content" tabindex="-1">
      <ng-content></ng-content>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
